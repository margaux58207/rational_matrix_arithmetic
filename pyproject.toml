[project]
name = "rational-matrix-arithmetic"
version = "0.1.0"
description = "Matrix addition, multiplication, determinant, and inverse using exact Fraction entries to avoid floating-point error."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
